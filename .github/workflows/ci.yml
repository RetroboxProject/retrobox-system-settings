name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # the files that are not shell (mouse-cursor-x11 is Python) go to pylint
          shellcheck -x -S style install.sh $(grep -L '^#!.*python' bin/* libexec/* tests/*.sh packaging/*.sh)
      - name: pylint
        run: |
          sudo apt-get install -y -qq pylint
          pylint $(grep -l '^#!.*python' bin/* libexec/*)

      - name: Smoke test
        run: tests/smoke-test.sh

      - name: Root-mode test (the package's setup)
        run: sudo tests/root-mode-test.sh

      - name: Update test (retrobox-update, fake GitHub API)
        run: |
          sudo apt-get install -y -qq jq
          tests/update-test.sh

      - name: Build the .deb
        run: |
          git fetch --tags --quiet || true
          packaging/build-deb.sh "" dist
          for deb in dist/*.deb; do dpkg-deb --info "${deb}"; dpkg-deb --contents "${deb}"; done

      - name: Upload the .deb
        uses: actions/upload-artifact@v4
        with:
          name: retrobox-system-settings-debs
          path: dist/*.deb
