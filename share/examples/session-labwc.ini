# /etc/retrobox/retrobox.ini.d/60-session.ini
#
# The machine's own word on its labwc gaming session. The retrobox-session-labwc
# package reads it when it is installed, upgraded or reconfigured
# (sudo dpkg-reconfigure retrobox-session-labwc, or sudo retrobox-session-install
# --machine): both keys are optional, and these are the defaults.
[advanced]
# The user who plays: must exist already, with a home, and not be root.
# Left out: the user with uid 1000.
labwc_user = neon

# The gaming TTY, 1-12. Left out: 8. Changing it moves the session there
# at the next reconfigure, and the machine starts on it at the next boot.
labwc_tty = 8
