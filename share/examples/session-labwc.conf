# /etc/retrobox/session-labwc.conf
#
# The machine's declaration of its labwc gaming session. If this file exists,
# the retrobox-session-labwc package (and "dpkg-reconfigure
# retrobox-session-labwc", or "retrobox-session-apply" as root) brings the
# machine to this state: the systemd service, the polkit rule and the files of
# the user. Running it again changes nothing. No file, no session.

# The user who plays: must exist already, with a home, and not be root.
RETROBOX_USER=neon

# The gaming TTY, 1-12. It cannot change once installed (uninstall first).
RETROBOX_TTY=2

# What happens when Retrobox quits normally: poweroff or shell.
# Optional: left out, the first install powers off and a re-run keeps the choice.
#RETROBOX_ON_QUIT=poweroff
